# Per-thread CPU-time accounting, so burn_cpu_ms() can count CPU time
# the thread actually received rather than wall-clock time.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# User-defined tracing hooks (src/trace.c) for every context switch,
# wake-up, pend and priority change. ctf.conf / notrace.conf swap these.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
# Explicit, so builds without CONFIG_TRACING (which implies it) still name threads.
CONFIG_THREAD_NAME=y

# crc32_ieee_update() for the trace dump checksum.
CONFIG_CRC=y
