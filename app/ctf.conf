# Zephyr's CTF tracer instead of src/trace.c (phase 2, step 5):
#   west build ... -- -DEXTRA_CONF_FILE=ctf.conf [-DCONFIG_TRACING_ISR=n]
# Sync mode: events go straight to the backend inside the hook. The default,
# async mode, adds a tracing thread whose flushing would perturb the schedule
# being measured.
CONFIG_TRACING_USER=n
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_RAM_TRACING_BUFFER_SIZE=32768
# Start disabled; the app enables it around the run (tracing_cmd_handle).
CONFIG_TRACING_HANDLE_HOST_CMD=y
